<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fueleo — personalized nutrition plans and fresh meals delivered through a weekly subscription."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f3ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171a12" />
    <title>Fueleo — Eating well should fit your life</title>
    <script>
      // Apply the saved (or system) theme before first paint so there is no theme flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('fueleo-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <style>
      /* Pre-CSS fallback so the first paint matches the chosen theme. */
      html {
        background: #f4f3ec;
      }
      html[data-theme='dark'] {
        background: #171a12;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
